name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache 4diac IDE ZIP
        uses: actions/cache@v4
        with:
          path: build/ide.zip
          key: ide-${{ hashFiles('build.sh') }}

      - name: Build
        run: bash build.sh

      - name: Check tag matches Bundle-Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(sed -n 's/^Bundle-Version: *//p' META-INF/MANIFEST.MF | tr -d '\r')
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != Bundle-Version $VER"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
